<!DOCTYPE html>
<html lang="ja">
<head>

 <style>
 body {
 font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;

 color: #333333;

 h1 {

 .header-stats {

 .top-controls {

 }

 .top-btn {

.btn-all { background-color: #7f8c8d; }

 .btn-unanswered { background-color: #3498db; }

 .btn-review { background-color: #e67e22; }
 .btn-review:hover { background-color: #d35400; }
 .btn-incorrect { background-color: #9b59b6; }
 .btn-incorrect:hover { background-color: #8e44ad; }

 .mode-indicator {

 font-weight: bold;
 margin-bottom: 10px;
 }

 #flashcard {

 max-width: 600px;

 }

 .date-badge {

 }

 .srs-badge {

 color: #e67e22;
 margin-bottom: 20px;
 font-weight: bold;
 }

 .english-text {

 font-weight: bold;
 color: #1a1a1a;
 margin-bottom: 25px;
 line-height: 1.4;
 text-align: center;
 }

 .english-text-back {
 font-size: 1.2rem;
 font-weight: bold;
 color: #34495e;
 margin-bottom: 15px;

 padding-bottom: 15px;
 }

 .japanese-text {

 font-weight: bold;
 color: #2c3e50;

 padding-bottom: 15px;
 }

 .note-box {

 border-left: 4px solid #f5a623;
 padding: 15px;
 border-radius: 4px;

 line-height: 1.6;
 color: #5c4716;
 width: 100%;
 box-sizing: border-box;
 }

 #play-audio-btn {
 font-size: 1.1rem;
 padding: 12px 24px;
 border-radius: 30px;
 background-color: #4a90e2;
 color: white;
 border: none;
 cursor: pointer;
 box-shadow: 0 4px 8px rgba(74, 144, 226, 0.3);
 transition: transform 0.1s, background-color 0.2s;

 font-weight: bold;
 }

 #play-audio-btn:active {
 transform: scale(0.95);

 }

 .controls {
 display: flex;
 gap: 10px;
 margin-top: 30px;
 width: 100%;
 max-width: 600px;
 justify-content: center;
 }

 .action-btn {
 flex: 1;
 padding: 15px 10px;
 font-size: 1rem;
 border: none;
 border-radius: 8px;
 cursor: pointer;
 font-weight: bold;
 transition: background-color 0.2s, opacity 0.2s;
 }

 #prev-btn { background-color: #e2e8f0; color: #4a5568; }
 #flip-btn { background-color: #4a90e2; color: white; }
 #next-btn { background-color: #e2e8f0; color: #4a5568; }

 .eval-btn {
 flex: 1;
 padding: 15px 5px;
 font-size: 1rem;
 border: none;
 border-radius: 8px;
 cursor: pointer;
 font-weight: bold;
 color: white;
 }

 #back-to-front-btn { background-color: #95a5a6; }
 #back-to-front-btn:hover { background-color: #7f8c8d; }
 #wrong-btn { background-color: #e74c3c; }
 #wrong-btn:hover { background-color: #c0392b; }
 
#correct-btn { background-color: #2ecc71; }
 #correct-btn:hover { background-color: #27ae60; }

 .empty-state {

 color: #2ecc71;
 font-weight: bold;
 text-align: center;
 line-height: 1.5;
 }
 </style>
</head>
<body>

 <h1>🎧 PLUTO②-1 フラッシュカード</h1>

 <div class="header-stats">
 <span id="progress-text">1 / 132</span>
 <span id="score-text">正解数: 0</span>
 </div>
 
<div class="mode-indicator" id="mode-indicator">現在のモード：📁 全問</div>

 <div class="top-controls">
 <button class="top-btn btn-all" onclick="setMode('all')">📁 全問</button>
 <button class="top-btn btn-unanswered" onclick="jumpToUnanswered()">🆕 未回答へジャンプ</button>
 <button class="top-btn btn-review" onclick="setMode('review')">📅 今日の復習</button>
 <button class="top-btn btn-incorrect" onclick="setMode('incorrect')">🎯 未正解</button>
 </div>

 <div id="flashcard">
 <div id="front-side">
 <div class="date-badge" id="date-badge">最終回答日：未回答</div>
 <div class="srs-badge" id="srs-badge"></div>
 <div class="english-text" id="front-eng-content"></div>
 <button id="play-audio-btn">🔊 音声を聴く</button>
 </div>

 <div id="back-side">
 <div class="english-text-back" id="back-eng-content"></div>
 <div class="japanese-text" id="jap-content"></div>
 <div class="note-box" id="note-content"></div>
 </div>
 </div>

 <div class="controls" id="controls-front">
 <button id="prev-btn" class="action-btn" onclick="prevCard()">◀ 前へ</button>
 <button id="flip-btn" class="action-btn" onclick="flipCard()">🔄 裏返す</button>
 <button id="next-btn" class="action-btn" onclick="nextCard()">次へ ▶</button>
 </div>

 <div class="controls" id="controls-back" style="display: none;">
 <button id="back-to-front-btn" class="eval-btn" onclick="returnToFront()">🔙 表面に戻る</button>
 <button id="wrong-btn" class="eval-btn" onclick="markIncorrect()">❌ 覚えてない</button>
 <button id="correct-btn" class="eval-btn" onclick="markCorrect()">◯ 完璧！</button>
 </div>

 <script>
 const cardsData = [
{"en": "Just what I need.", "jp": "願ったり叶ったりだな。（まいったな、まさに求めていた展開だ／皮肉）[cite: 3]", "note": "Just what I need. は「まさに欲しかったものだ」が直訳ですが、雨の中での凄惨な事件現場などでは「ついてないな、願ってもない悲惨な状況だ」という皮肉（Sarcasm）としてよく使われます。[cite: 3]"},
{"en": "For what it's worth, we made a positive ID on the victim, sir.", "jp": "念のためお伝えしますと、被害者の身元は確実（確認済み）です、警部。[cite: 3]", "note": "For what it's worth は「参考までに、役に立つかどうか分かりませんが」。make a positive ID (on...) は「（被害者・容疑者の）身元を確定・確認する」という警察・鑑識用語。[cite: 3]"},
{"en": "Junichiro Tazaki. A legal scholar.", "jp": "田崎純一郎。法学者です。[cite: 3]", "note": "legal scholar は「法学者、法律研究者」。[cite: 3]"},
{"en": "He was the one that first proposed the International Robot Laws.", "jp": "国際ロボット法を最初に提唱した人物です。[cite: 3]", "note": "He was the one that... は「〜した張本人・人物である」。propose は「〜を提案する、提唱する」。[cite: 3]"},
{"en": "Hold on. You're telling me this dead guy strung up in the rain", "jp": "ちょっと待て。雨の中で吊るされているこの仏（遺体）が…[cite: 3]", "note": "Hold on. は「ちょっと待て」。string up は「（人を縄などで）吊るし上げる、首を吊るす」。[cite: 3]"},
{"en": "was the egghead who gave robots equal rights?", "jp": "ロボットに同等の権利を与えた、あのインテリ（ガリ勉）だって言うのか？[cite: 3]", "note": "egghead はインテリや学者を少し見下した・軽蔑を込めた口語スラング（インテリインコ、頭の硬いガリ勉）。equal rights は「平等の権利、同等の権利」。[cite: 3]"},
{"en": "- That's him. - [grunts]", "jp": "- （刑事1）その通りです。 - （警視総監）うーむ。[cite: 3]", "note": "That's him. は「彼で間違いありません、その人です」。[cite: 3]"},
{"en": "Well then, I guess we start questioning the anti-robot groups.", "jp": "だったら、まずは反ロボット団体を取り調べ（聞き取り）始めるか。[cite: 3]", "note": "I guess... は「〜と思う、〜かな」。question は動詞で「（警察が〜を）取り調べる、尋問する」。anti-robot groups は「反ロボット団体」。[cite: 3]"},
{"en": "- All of the usual suspects. - Right.", "jp": "- （刑事1）いつものお決まりの容疑者たちですね。 - （警視総監）ああ。[cite: 3]", "note": "the usual suspects は「お決まりの容疑者たち、常連組」。映画のタイトル（ユージュアル・サスペクツ）でも有名な警察定番表現。[cite: 3]"},
{"en": "Check out his head.", "jp": "彼の頭を見てください。[cite: 3]", "note": "Check out... は「〜をよく調べる、調べる、確認する」。[cite: 3]"},
{"en": "I feel like I remember some other cases involving horns recently.", "jp": "最近、角（ツノ）が絡む事件が他にもあった気がするんだが。[cite: 3]", "note": "I feel like I remember... は「〜の記憶があるような気がする」。involve は「〜を巻き込む、〜が関与・関連する」。[cite: 3]"},
{"en": "We'll look into it.", "jp": "詳しく調べます（照会してみます）。[cite: 3]", "note": "look into... は「（事件・問題などを）調査する、調べる」という超頻出重要句動詞。[cite: 3]"},
{"en": "Uh, you there.", "jp": "おい、そこのお前。[cite: 3]", "note": "you there は「そこの君、そこのお前」と呼びかける口語表現。[cite: 3]"},
{"en": "All right. What in the blue hell could have done this?", "jp": "よし。一体全体、何がこんなことをしたっていうんだ？[cite: 3]", "note": "What in the blue hell...? は What in the hell...?（一体全体何が〜だ？）の強烈な強調スラング。could have done... は「〜した可能性がある、〜し得ただろうか」。[cite: 3]"},
{"en": "Malicious or bad luck?", "jp": "悪意（事件）なのか、それとも不運な事故なのか？[cite: 3]", "note": "malicious は「悪意のある、故意の」。事故（bad luck）か事件（malicious intent）かを問う捜査上のフレーズ。[cite: 3]"},
{"en": "Did this thing collapse on its own, or did someone demolish the place?", "jp": "これ（建物）が勝手に倒壊したのか、それとも誰かがここを破壊（解体）したのか？[cite: 3]", "note": "on its own は「それ自体で、自然に、独力で」。demolish は「（建物などを）破壊する、打ち壊す」。[cite: 3]"},
{"en": "We'll have an answer for you soon.", "jp": "すぐに判明（回答）いたします。[cite: 3]", "note": "have an answer は「答え・結論が出る」。[cite: 3]"},
{"en": "You know, all this wouldn't be out of the question for you lot.", "jp": "おい、お前たち（ロボットども）にとっちゃ、これくらい造作もない（不可能なことではない）だろう。[cite: 3]", "note": "out of the question は本来「不可能で、論外で」という意味。ここでは「wouldn't be out of the question（あり得ないことではない ＝ 十分に可能だ）」と二重否定的に使われています。you lot は「お前たち、あんたたち」という粗野な呼称。[cite: 3]"},
{"en": "Sir?", "jp": "とおっしゃいますと？（警部？）[cite: 3]", "note": ""},
{"en": "Enough juice under the hood? A robot could do this. Piece of cake.", "jp": "ボンネットの下にパワー（内部馬力）さえあればな。ロボットならこんなの朝飯前だろ。[cite: 3]", "note": "juice under the hood は本来「車のエンジンの馬力・出力」を指す比喩。転じてロボットの内部パワー。Piece of cake. は「朝飯前、超簡単」という定番フレーズ。[cite: 3]"},
{"en": "Superintendent!", "jp": "警視正（総監）！[cite: 3]", "note": "Superintendent は警察の階級で「警視正、警視長、警察署長」。[cite: 3]"},
{"en": "We found the other cases! Switzerland and Germany.", "jp": "例の他の事件が見つかりました！ スイスとドイツです。[cite: 3]", "note": "other cases は「他の類似事件」。[cite: 3]"},
{"en": "That's right.", "jp": "ああ、そうだったな。[cite: 3]", "note": ""},
{"en": "They found horns on the head of that destroyed robot, Mont Blanc.", "jp": "破壊されたあのロボット、モンブランの頭部にも角（ツノ）がついていました。[cite: 3]", "note": "destroyed robot は「破壊されたロボット」。[cite: 3]"},
{"en": "The other incident that fit the bill was Düsseldorf, Germany.", "jp": "条件（手口）に合致するもう一つの事件は、ドイツのデュッセルドルフです。[cite: 3]", "note": "fit the bill は「（条件・要求・目的に）ぴったり合致する、好都合である」という超重要イディオム。[cite: 3]"},
{"en": "Victim there was a human. Bernard Lanke. He was a leading figure in the Robot Liberation Movement.", "jp": "そちらの被害者は人間で、ベルナルド・ランケ。ロボット解放運動の中心人物でした。[cite: 3]", "note": "leading figure は「中心人物、第一人者、指導的存在」。Robot Liberation Movement は「ロボット解放運動」。[cite: 3]"},
{"en": "I guess we better reach out to Europol.", "jp": "ユーロポール（欧州刑事警察機構）に連絡を取った方が良さそうだな。[cite: 3]", "note": "had better + 動詞の原形（ここでは 'd が省略された we better...）は「〜した方がいい、〜すべきだ」。reach out to... は「〜に連絡を取る、働きかける」。[cite: 3]"},
{"en": "See what the investigators on each of these cases can tell us.", "jp": "それぞれの事件の担当捜査官が何を教えてくれるか確認してみろ。[cite: 3]", "note": "investigator は「捜査官、調査員」。[cite: 3]"},
{"en": "Looking at the agency data, seems like the same detective is point of contact on both of them.", "jp": "機関のデータを見ると、両方の事件で同じ刑事が連絡窓口（担当者）になっているようです。[cite: 3]", "note": "point of contact は「連絡窓口、担当窓口、連絡先」というビジネス・警察実用英語。[cite: 3]"},
{"en": "Both the same guy?", "jp": "両方とも同じ奴なのか？[cite: 3]", "note": ""},
{"en": "Uh-huh. Says here the detective's a robot.", "jp": "ええ。ここによると、その刑事はロボットだそうです。[cite: 3]", "note": "It says here (that)... は「ここ（書類や画面など）には〜と書いてある」の日常定番表現。[cite: 3]"},
{"en": "Well, if that don't beat all.", "jp": "おいおい、驚いたな（呆れた／参ったな）。[cite: 3]", "note": "If that doesn't beat all! （口語では don't）は「これには参った、驚き呆れた、これ以上の驚きはない」という、感嘆・驚愕を表すイディオム。[cite: 3]"},
{"en": "What's he call himself?", "jp": "何て名乗っているんだ？[cite: 3]", "note": "What does he call himself? の口語縮約。「本人は何と名乗っているか」。[cite: 3]"},
{"en": "Gesicht, sir.", "jp": "ゲジヒトです、警部。[cite: 3]", "note": ""},
{"en": "Hmm?", "jp": "む？[cite: 3]", "note": ""},
{"en": "Uh… Wow!", "jp": "おや……わお！[cite: 3]", "note": "カフェでアトムと初対面したゲジヒトの驚きの声。[cite: 3]"},
{"en": "How curious.", "jp": "なんと奇妙な（興味深い）ことだろう。[cite: 3]", "note": "How curious. は感嘆文で「なんて奇妙なんだ、不思議だな」。[cite: 3]"},
{"en": "What do you mean, sir?", "jp": "どういう意味ですか、おじさん（刑事さん）？[cite: 3]", "note": "What do you mean? は「どういう意味ですか？」。[cite: 3]"},
{"en": "I'm looking right at you, and I know you're a fellow robot,", "jp": "こうして目の前で君を見つめていて、同じロボットだと分かってはいるんだが、[cite: 3]", "note": "fellow robot は「仲間（同胞）のロボット」。[cite: 3]"},
{"en": "but my identification system can barely tell the difference.", "jp": "私の識別システムでさえ、人間との違いをほとんど見分けられないよ。[cite: 3]", "note": "barely は「ほとんど〜ない」（否定表現）。tell the difference は「違いを見分ける、識別する」という重要表現。[cite: 3]"},
{"en": "Yeah, I get that a lot.", "jp": "ええ、よく言われます（みんなにそう言われます）。[cite: 3]", "note": "I get that a lot. は「よく（人から）言われます」という、日常生活で超頻出する定番口語表現。[cite: 3]"},
{"en": "I mean, I've seen you on the news several times, of course,", "jp": "もちろん、ニュースで君の姿を何度も見かけたことはあったんだが、[cite: 3]", "note": "I mean... は「つまり、というか」。several times は「数回、何度も」。[cite: 3]"},
{"en": "but even as we're sitting here talking face-to-face…", "jp": "こうして膝を突き合わせて直に話していても……[cite: 3]", "note": "face-to-face は「対面で、直接会って」。[cite: 3]"},
{"en": "On the news?", "jp": "ニュースでですか？[cite: 3]", "note": ""},
{"en": "Yes. The media raised quite a fuss over your inclusion", "jp": "ああ。平和維持軍への君の参加（編入）について、メディアは大騒ぎしていたからね。[cite: 3]", "note": "raise a fuss (over...) は「（〜を巡って）大騒ぎする、大騒動を起こす」。inclusion は「含めること、参加、編入」。[cite: 3]"},
{"en": "when you were deployed with the peacekeeping forces", "jp": "君が平和維持軍とともに派遣された時だ。[cite: 3]", "note": "deploy は「（軍隊やロボットなどを）派遣する、配備する」。peacekeeping forces は「平和維持軍（PKO）」。[cite: 3]"},
{"en": "during the Central Asian War.", "jp": "中アジア戦争の最中にな。[cite: 3]", "note": "Central Asian War は「第39次中アジア戦争」。[cite: 3]"},
{"en": "You were aware of that, were you not?", "jp": "君もそのことは知っていた（自覚していた）だろう？[cite: 3]", "note": "be aware of... は「〜を認識している、自覚している」。were you not? はフォーマルな付加疑問。[cite: 3]"},
{"en": "Yeah.", "jp": "ええ。[cite: 3]", "note": ""},
{"en": "I went to help defend the peace.", "jp": "僕は平和を守る手助けをするために行きました。[cite: 3]", "note": "defend the peace は「平和を守る、防衛する」。[cite: 3]"},
{"en": "But the whole time I was over there, the media kept treating me like I was just some…", "jp": "でも僕があっちにいた間ずっと、メディアは僕を単なる……[cite: 3]", "note": "the whole time は「その間ずっと」。treat A like B は「AをBのように扱う」。[cite: 3]"},
{"en": "Like some touring idol or pop star, when all you wanted was to keep everyone safe.", "jp": "ツアー中のアイドルかポップスターのように扱っていたね。君はただみんなの安全を守りたかっただけなのに。[cite: 3]", "note": "all you wanted was to... は「君が望んでいたすべてのことは〜することだった ＝ 君はただ〜したかっただけなのに」。アトムの心情をゲジヒトが見事に言語化しています。[cite: 3]"},
{"en": "Uh-huh.", "jp": "うん……。[cite: 3]", "note": ""},
{"en": "Thank you for waiting.", "jp": "お待たせいたしました。[cite: 3]", "note": "接客の定番「お待たせいたしました」。[cite: 3]"},
{"en": "It looks so good!", "jp": "すごく美味しそう！[cite: 3]", "note": "It looks good! は料理を見て「美味しそう！」と言う時の超定番フレーズ。[cite: 3]"},
{"en": "Is something wrong?", "jp": "何かおかしいですか？[cite: 3]", "note": "Is something wrong? は「何かあったの？ どうかしたの？」。[cite: 3]"},

 // ---- データマイグレーションと初期化 ----
 const savedEvaluated = localStorage.getItem('pluto_2_1_evaluated');
 const savedDates = localStorage.getItem('pluto_2_1_dates');
 const savedSrs = localStorage.getItem('pluto_2_1_srs');

 let evaluatedCards = savedEvaluated ? JSON.parse(savedEvaluated) : new Array(cardsData.length).fill(false);
 let answerDates = savedDates ? JSON.parse(savedDates) : new Array(cardsData.length).fill(null);
 
let srsData = savedSrs ? JSON.parse(savedSrs) : new Array(cardsData.length).fill(null).map(() => ({
 interval: 0,
 ease: 2.5,
 repetitions: 0,
 nextReview: null
 }));

 let currentCardIndex = 0;
 let correctCount = evaluatedCards.filter(Boolean).length;
 let isFront = true;
 let currentMode = 'all'; // 'all', 'unanswered', 'review', 'incorrect'

 const frontSide = document.getElementById('front-side');
 const backSide = document.getElementById('back-side');
 const frontEngContent = document.getElementById('front-eng-content');
 const backEngContent = document.getElementById('back-eng-content');
 const japContent = document.getElementById('jap-content');
 const noteContent = document.getElementById('note-content');
 
const controlsFront = document.getElementById('controls-front');
 const controlsBack = document.getElementById('controls-back');
 const progressText = document.getElementById('progress-text');
 const scoreText = document.getElementById('score-text');
 const playBtn = document.getElementById('play-audio-btn');
 const dateBadge = document.getElementById('date-badge');
 const srsBadge = document.getElementById('srs-badge');
 const modeIndicator = document.getElementById('mode-indicator');

 function saveProgress() {
 localStorage.setItem('pluto_2_1_evaluated', JSON.stringify(evaluatedCards));
 localStorage.setItem('pluto_2_1_dates', JSON.stringify(answerDates));
 localStorage.setItem('pluto_2_1_srs', JSON.stringify(srsData));
 }

 // YYYY-MM-DD 形式で日付を取得（比較用）
 function getTodayStringFormatted() {
 const d = new Date();
 const y = d.getFullYear();
 const m = String(d.getMonth() + 1).padStart(2, '0');
 const day = String(d.getDate()).padStart(2, '0');
 return `${y}-${m}-${day}`;
 }

 // 指定日数を足した日付文字列を返す
 function addDaysToDate(days) {
 const d = new Date();
 d.setDate(d.getDate() + days);
 const y = d.getFullYear();
 const m = String(d.getMonth() + 1).padStart(2, '0');
 const day = String(d.getDate()).padStart(2, '0');
 return `${y}-${m}-${day}`;
 }

 function getVisibleIndices() {
 let indices = [];
 const today = getTodayStringFormatted();
 
for (let i = 0; i < cardsData.length; i++) {
 if (currentMode === 'all') {
 indices.push(i);
 } else if (currentMode === 'unanswered') {
 if (!answerDates[i]) indices.push(i);
 } else if (currentMode === 'incorrect') {
 if (answerDates[i] && !evaluatedCards[i]) indices.push(i);
 } else if (currentMode === 'review') {
 // 次回の復習日が設定されていて、かつ今日以前の場合
 if (srsData[i].nextReview && srsData[i].nextReview <= today) {
 indices.push(i);
 }
 }
 }
 return indices;
 }

 function updateUI() {
 let indices = getVisibleIndices();
 
if (indices.length === 0) {
 frontSide.style.display = 'flex';
 backSide.style.display = 'none';
 controlsFront.style.display = 'none';
 controlsBack.style.display = 'none';
 frontEngContent.innerHTML = "<div class='empty-state'>🎉 このモードの対象カードはありません！<br>上のボタンから別のモードに切り替えてね。</div>";
 dateBadge.style.display = 'none';
 srsBadge.style.display = 'none';
 playBtn.style.display = 'none';
 progressText.textContent = `- / ${cardsData.length}`;
 scoreText.textContent = `正解数: ${correctCount}`;
 return;
 }

 dateBadge.style.display = 'inline-block';
 srsBadge.style.display = 'block';
 playBtn.style.display = 'flex';

 if (!indices.includes(currentCardIndex)) {
 currentCardIndex = indices[0];
 }

 let pos = indices.indexOf(currentCardIndex);
 progressText.textContent = `${pos + 1} / ${indices.length} (全${cardsData.length}問)`;
 scoreText.textContent = `正解数: ${correctCount}`;

 let dateStr = answerDates[currentCardIndex];
 dateBadge.textContent = dateStr ? `最終回答日：${dateStr}` : `最終回答日：未回答`;

 let srs = srsData[currentCardIndex];
 if (srs.nextReview) {
 srsBadge.textContent = `次回予定日: ${srs.nextReview} (連続正解: ${srs.repetitions}回)`;
 } else {
 srsBadge.textContent = `まだSRSに登録されていません`;
 }

 if (isFront) {
 frontSide.style.display = 'flex';
 backSide.style.display = 'none';
 controlsFront.style.display = 'flex';
 controlsBack.style.display = 'none';
 } else {
 frontSide.style.display = 'none';
 backSide.style.display = 'flex';
 controlsFront.style.display = 'none';
 controlsBack.style.display = 'flex';
 }

 frontEngContent.textContent = cardsData[currentCardIndex].en;
 backEngContent.textContent = cardsData[currentCardIndex].en;
 japContent.textContent = cardsData[currentCardIndex].jp;
 
if (cardsData[currentCardIndex].note) {
 noteContent.style.display = 'block';
 noteContent.textContent = "💡 " + cardsData[currentCardIndex].note;
 } else {
 noteContent.style.display = 'none';
 }
 }

 function flipCard() {
 isFront = !isFront;
 updateUI();
 }

 function returnToFront() {
 isFront = true;
 updateUI();
 }

 function advanceCard(forward) {
 let indices = getVisibleIndices();
 if (indices.length === 0) {
 updateUI();
 return;
 }

 let pos = indices.indexOf(currentCardIndex);
 
if (pos !== -1) {
 if (forward) {
 currentCardIndex = indices[(pos + 1) % indices.length];
 } else {
 // 前へボタンのループ処理
 currentCardIndex = indices[(pos - 1 + indices.length) % indices.length];
 }
 } else {
 let nextIdx = indices.find(i => i > currentCardIndex);
 currentCardIndex = nextIdx !== undefined ? nextIdx : indices[0];
 }
 
isFront = true;
 updateUI();
 }

 function nextCard() { advanceCard(true); }
 function prevCard() { advanceCard(false); }

 function markCorrect() {
 // 従来のカウント用処理
 let wasCorrect = evaluatedCards[currentCardIndex];
 if (!wasCorrect) {
 correctCount++;
 evaluatedCards[currentCardIndex] = true;
 }
 answerDates[currentCardIndex] = getTodayStringFormatted();

 // SRS (SM-2) アルゴリズムによる「完璧！」の処理
 let cardSrs = srsData[currentCardIndex];
 cardSrs.repetitions += 1;
 
if (cardSrs.repetitions === 1) {
 cardSrs.interval = 1; // 初回は1日後
 } else if (cardSrs.repetitions === 2) {
 cardSrs.interval = 6; // 2回目は6日後
 } else {
 cardSrs.interval = Math.round(cardSrs.interval * cardSrs.ease);
 }
 cardSrs.nextReview = addDaysToDate(cardSrs.interval);

 saveProgress();
 nextCard();
 }

 function markIncorrect() {
 // 従来のカウント用処理
 let wasCorrect = evaluatedCards[currentCardIndex];
 if (wasCorrect) {
 correctCount--;
 evaluatedCards[currentCardIndex] = false;
 }
 answerDates[currentCardIndex] = getTodayStringFormatted();

 // SRS (SM-2) アルゴリズムによる「覚えてない」の処理
 let cardSrs = srsData[currentCardIndex];
 cardSrs.repetitions = 0; // 連続正解リセット
 cardSrs.interval = 1; // 翌日に再出題
 cardSrs.ease = Math.max(1.3, cardSrs.ease - 0.2); // 定着度（難易度係数）を下げる
 cardSrs.nextReview = addDaysToDate(cardSrs.interval);

 saveProgress();
 nextCard();
 }

 function setMode(mode) {
 currentMode = mode;
 
const modeNames = {
 'all': '📁 全問',
 'unanswered': '🆕 未回答',
 'review': '📅 今日の復習',
 'incorrect': '🎯 未正解'
 };
 modeIndicator.textContent = `現在のモード：${modeNames[mode]}`;

 let indices = getVisibleIndices();
 if (indices.length > 0) {
 currentCardIndex = indices[0];
 }
 isFront = true;
 updateUI();
 }

 function jumpToUnanswered() {
 let indices = getVisibleIndices();
 if (indices.length === 0) return;

 let targetIndex = indices.find(index => !answerDates[index]);

 if (targetIndex !== undefined) {
 currentCardIndex = targetIndex;
 } else {
 currentCardIndex = indices[0];
 }
 
isFront = true;
 updateUI();
 }

 function speakText() {
 const textToSpeak = cardsData[currentCardIndex].en;
 window.speechSynthesis.cancel();
 const utterance = new SpeechSynthesisUtterance(textToSpeak);
 utterance.lang = 'en-US';
 utterance.rate = 0.9;
 window.speechSynthesis.speak(utterance);
 }

 playBtn.addEventListener('click', speakText);

 updateUI();
 </script>
</body>
